<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Add Student Result</h1>

    <form method="POST">
        <label>Student Name</label>
        <input type="text" name="name" required>

        <label>Roll Number</label>
        <input type="text" name="roll_no" required>

        <label>Mark 1</label>
        <input type="number" name="mark1" min="0" max="100" required>

        <label>Mark 2</label>
        <input type="number" name="mark2" min="0" max="100" required>

        <label>Mark 3</label>
        <input type="number" name="mark3" min="0" max="100" required>

        <button type="submit">Calculate Result</button>
    </form>

    <br>
    <a href="/">Back to Home</a>
</div>
</body>
</html>
